name: Web Deploy (GCP Cloud Run)

# Deploys main to Cloud Run. Auth via Workload Identity Federation (no keys).
# Replaces the AWS deploy.yml path. CI checks live in ci.yml.
# NEXT_PUBLIC_* must be inlined at build time, so they are passed as Docker
# build-args (sourced from GitHub Actions secrets), NOT runtime env.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-deploy-gcp-main
  cancel-in-progress: true

permissions:
  id-token: write   # required for Workload Identity Federation
  contents: read

env:
  PROJECT_ID: study-helper-492805
  REGION: asia-northeast3
  SERVICE: study-helper-web
  AR_REPO: study-helper
  WIF_PROVIDER: projects/469469589402/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOY_SA: gh-deploy@study-helper-492805.iam.gserviceaccount.com

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push image (NEXT_PUBLIC_* baked in)
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${SERVICE}:${GITHUB_SHA}"
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_BACKEND_URL="${{ secrets.NEXT_PUBLIC_BACKEND_URL }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --set-env-vars "NODE_ENV=production,HOSTNAME=0.0.0.0" \
            --quiet

      - name: Show service URL
        run: |
          gcloud run services describe "${SERVICE}" --region "${REGION}" \
            --format="value(status.url)"
