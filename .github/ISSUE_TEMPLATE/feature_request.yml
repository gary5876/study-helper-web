name: 기능 요청
description: 새 기능·개선 제안
title: "[feat] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
      description: 어떤 페이지/컴포넌트/동작이 추가되면 되는가
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안 / 검토한 옵션
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위 (제안)
      options:
        - 높음
        - 중간
        - 낮음
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 영향 / 트레이드오프
      description: 백엔드 스키마 변경, 보안 헤더, SEO, 성능 등
