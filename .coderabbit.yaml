# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "ko-KR"
tone_instructions: "한국어로, 단정적이지만 정중하게 리뷰. Next.js App Router 흐름, 서버/클라이언트 컴포넌트 경계, Supabase Auth 토큰 처리, 보안 헤더·오픈 리다이렉트 차단에 우선순위를 둔다."
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "develop"
    ignore_title_keywords:
      - "WIP"
      - "DO NOT REVIEW"

  path_filters:
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/coverage/**"
    - "!**/public/**"
    - "!**/*.tsbuildinfo"

  path_instructions:
    - path: "src/app/**/*.{ts,tsx}"
      instructions: |
        Next.js App Router. 다음을 중점 검토:
        - 서버/클라이언트 컴포넌트 분리: "use client" 위치, 서버 컴포넌트에서
          브라우저 API 사용 여부
        - 데이터 페칭: cache 정책 (no-store/force-cache/revalidate),
          민감 데이터 클라이언트 노출 금지
        - 메타데이터: generateMetadata 사용, OG/SEO 누락 여부
        - 라우트 핸들러: 인증 검증, 입력 검증, 에러 응답 형식
    - path: "src/lib/**/*.{ts,tsx}"
      instructions: |
        공통 유틸/클라이언트. 다음을 중점 검토:
        - Supabase Auth: Authorization 헤더 일관성, 세션 갱신
        - 보안 헤더: CSP/HSTS/Referrer-Policy/Permissions-Policy
        - 오픈 리다이렉트 차단: returnTo 파라미터 화이트리스트
        - 환경 변수: NEXT_PUBLIC_* 이외 값이 클라이언트로 누출되지 않는지
    - path: "src/proxy.ts"
      instructions: |
        프록시 레이어. URL 검증, 헤더 화이트리스트, SSRF 방지를 점검.
    - path: "next.config.ts"
      instructions: |
        Next 설정. headers/redirects/rewrites, images 도메인 화이트리스트,
        실험 기능 활성화 영향도를 검토.

  tools:
    eslint:
      enabled: true
    biome:
      enabled: false
    markdownlint:
      enabled: true
    languagetool:
      enabled: false
    ast-grep:
      essential_rules: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
